name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

  build-web:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build --filter=web

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/api/go.sum

      - name: Build
        working-directory: apps/api
        run: go build ./...

      - name: Test
        working-directory: apps/api
        run: go test ./... -v

  build-ai-engine:
    name: Build AI Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/ai-engine
        run: |
          pip install -r requirements.txt
          # Test + lint deps. Previously undeclared, so this job could lint but
          # never run the suite.
          pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/ai-engine
        # ruff is version-pinned in the dev extra on purpose. It was unpinned, and
        # ruff 0.16 widened its implicit default rule set from ~4 findings to ~600
        # on this tree — CI went red on a dependency release, with no code change.
        # The rule set is now declared in pyproject.toml [tool.ruff.lint].
        run: ruff check .

      - name: Test
        working-directory: apps/ai-engine
        run: pytest -q

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        # Pinned to a release rather than @master: this job's result should change
        # when the code or the advisory database changes, not when the action does.
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          # Only fail on findings that have a published fix. An unfixed advisory in
          # a transitive dependency is not something this repo can act on, and
          # failing the build on it just trains people to ignore the red X.
          ignore-unfixed: true
          exit-code: 1
