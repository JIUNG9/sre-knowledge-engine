[project]
name = "aegis-ai-engine"
version = "0.1.0"
description = "AI-Native DevSecOps Command Center — AI Engine"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Aegis Contributors" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.42.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "typer>=0.12.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "pyyaml>=6.0.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
# Microsoft Presidio is an optional, heavier dependency pulled in only when
# higher-precision PII detection (person names, phone numbers, credit cards)
# is desired. The proxy degrades cleanly to regex-only when it is absent.
presidio = [
    "presidio-analyzer>=2.2.0",
]
aws = ["boto3>=1.34.0"]
# Test-only dependencies. These were previously undeclared, which is why CI could
# lint the AI engine but never run its 470 tests — the workflow had no way to know
# what to install.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis>=2.26.0",
    "respx>=0.22.0",
    "ruff==0.16.1",
]
# Phase 2.2 FinOps MCP tools. `boto3` is required for AWS Cost Explorer;
# OpenCost and Kubecost use plain httpx which is already a core dep.
finops = [
    "boto3>=1.34.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "fakeredis>=2.20.0",
    "boto3>=1.34.0",
    "moto[ce]>=5.0.0",
]

[project.scripts]
aegis = "cli.main:run"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "mcp*", "mcp.tools.read.finops*", "models*", "proxy*", "routers*", "killswitch*", "cli*", "services*", "wiki*", "telemetry*", "guardrails*", "connectors*", "reconciliation*", "control_tower*", "llm_router*", "scheduler*", "executor*", "state_subscription*", "invalidation*"]

[tool.pytest.ini_options]
testpaths = [
    "proxy/tests",
    "killswitch/tests",
    "honeytokens/tests",
    "telemetry/tests",
    "mcp/tests",
    "mcp/tools/read/finops/tests",
    "guardrails/tests",
    "connectors/tests",
    "reconciliation/tests",
    "control_tower/tests",
    "scheduler/tests",
    "executor/tests",
    "state_subscription/tests",
    "invalidation/tests",
]
pythonpath = ["."]

# Declared explicitly so the lint result depends on this file, not on whichever
# ruff version CI happens to install. Ruff 0.16 widened its implicit defaults
# from ~4 findings to ~600 on this tree with no code change — CI went red on a
# dependency release. The version is pinned in the workflow for the same reason.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI's Depends() in defaults is the framework's idiom
    # UP042 wants (str, Enum) -> StrEnum. Deliberately declined: StrEnum changes
    # what str(member) returns (the value, not "Class.MEMBER"), and these enums are
    # serialized into JSON payloads and wiki frontmatter. The rewrite is a silent
    # format change on persisted data, which is not worth a lint score.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
