# ────────────────────────────────────────────────────────────────
#  Aegis Layer 0.8 — Demo Mode
#  Self-contained local demo stack. Zero real credentials required.
#
#  Total RAM budget: ~8GB
#  Boot time: ~3-5 minutes (cold) / ~90s (warm cache)
#
#  Usage:  make -C deploy/demo demo
# ────────────────────────────────────────────────────────────────
version: "3.9"

name: aegis-demo

networks:
  aegis-demo:
    driver: bridge

volumes:
  signoz-clickhouse:
  signoz-zookeeper:
  signoz-queryservice:
  localstack-data:
  ollama-models:
  redis-demo:
  aegis-vault:

x-demo-common: &demo-common
  restart: unless-stopped
  networks:
    - aegis-demo

services:
  # ═══════════════════════════════════════════════════════════
  #  SigNoz stack (observability backend)
  # ═══════════════════════════════════════════════════════════
  signoz-zookeeper:
    <<: *demo-common
    # Was bitnami/zookeeper:3.7.1, which now 404s — Bitnami pulled its legacy tags
    # from Docker Hub, so a pin that worked when this was written stopped resolving.
    # bitnamilegacy is their archive namespace and is a genuine drop-in: same
    # ALLOW_ANONYMOUS_LOGIN / ZOO_AUTOPURGE_INTERVAL contract, same
    # /bitnami/zookeeper data path.
    #
    # It is an archive, so it won't get patches. The forward path is ClickHouse
    # Keeper, which SigNoz supports and which drops ZooKeeper from the stack
    # entirely — worth doing, but it's a stack change, not a build fix.
    image: bitnamilegacy/zookeeper:3.7.1
    container_name: aegis-demo-zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
    volumes:
      - signoz-zookeeper:/bitnami/zookeeper
    deploy:
      resources:
        limits:
          memory: 512M

  signoz-clickhouse:
    <<: *demo-common
    image: clickhouse/clickhouse-server:24.1.2-alpine
    container_name: aegis-demo-clickhouse
    depends_on:
      - signoz-zookeeper
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - signoz-clickhouse:/var/lib/clickhouse
      # Binds to 0.0.0.0 instead of the default `::`. Without this nothing is bound
      # at all on an IPv6-less Docker network. See the comments in the file.
      - ./clickhouse/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
    healthcheck:
      # 127.0.0.1, not localhost. /etc/hosts in this image maps localhost to ::1
      # only, so once ClickHouse is IPv4-only (above) a check against localhost gets
      # "Connection refused" while the server is perfectly healthy — verified by
      # netstat showing 0.0.0.0:8123 LISTEN and localhost still refusing.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Without start_period the check gets interval x retries = 50s total, and
      # ClickHouse doesn't finish starting in 50s on a CI runner sharing a box with
      # eight other containers. It was killed at 51s with only "Processing
      # configuration file" in its log — still booting, not broken. Failures during
      # start_period don't count against retries.
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1500M

  signoz-query-service:
    <<: *demo-common
    image: signoz/query-service:0.55.0
    container_name: aegis-demo-signoz-query
    command: ["-config=/root/config/prometheus.yml"]
    environment:
      - ClickHouseUrl=tcp://signoz-clickhouse:9000
      - ALERTMANAGER_API_PREFIX=http://signoz-alertmanager:9093/api/
      - SIGNOZ_LOCAL_DB_PATH=/var/lib/signoz/signoz.db
      - DASHBOARDS_PATH=/root/config/dashboards
      - STORAGE=clickhouse
      - TELEMETRY_ENABLED=false
      - DEPLOYMENT_TYPE=docker-standalone-amd
    volumes:
      - signoz-queryservice:/var/lib/signoz/
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  signoz-frontend:
    <<: *demo-common
    image: signoz/frontend:0.55.0
    container_name: aegis-demo-signoz-ui
    ports:
      - "3301:3301"
    environment:
      - FRONTEND_API_ENDPOINT=http://signoz-query-service:8080
    depends_on:
      - signoz-query-service
    deploy:
      resources:
        limits:
          memory: 256M

  signoz-otel-collector:
    <<: *demo-common
    image: signoz/signoz-otel-collector:0.88.24
    container_name: aegis-demo-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=aegis-demo
      - CLICKHOUSE_URL=tcp://signoz-clickhouse:9000
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ═══════════════════════════════════════════════════════════
  #  Synthetic telemetry generator (traces + metrics + logs -> collector)
  # ═══════════════════════════════════════════════════════════
  #  Was `otel/opentelemetry-demo:1.11.1`, which does not exist — the
  #  OpenTelemetry demo has never shipped as a single all-in-one image; it is a
  #  ~15-service compose project, and `otel/demo` publishes one tag per service
  #  (latest-frontend, latest-payment, ...). The pull failed with "repository does
  #  not exist", so `docker compose up` aborted and this workflow could never have
  #  passed. See deploy/demo/README.md.
  #
  #  telemetrygen is the collector-contrib project's own tool for exactly this
  #  job: emit OTLP traces/metrics/logs at a fixed rate. What the demo actually
  #  needs is data flowing into SigNoz so Aegis has something to reason about —
  #  not an astronomy shop.
  otel-telemetrygen:
    <<: *demo-common
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.158.0
    container_name: aegis-demo-telemetrygen
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          for signal in traces metrics logs; do
            /telemetrygen "$$signal" \
              --otlp-endpoint signoz-otel-collector:4317 \
              --otlp-insecure \
              --duration 30s \
              --rate 5 \
              --otlp-attributes 'service.name="astronomy-shop"' \
              --otlp-attributes 'service.namespace="demo"' \
              --otlp-attributes 'deployment.environment="demo"' || true
          done
        done
    depends_on:
      - signoz-otel-collector
    deploy:
      resources:
        limits:
          memory: 256M

  # ═══════════════════════════════════════════════════════════
  #  LocalStack (AWS mocks: S3, EC2, CloudWatch Logs, IAM)
  # ═══════════════════════════════════════════════════════════
  localstack:
    <<: *demo-common
    image: localstack/localstack:3.8
    container_name: aegis-demo-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,ec2,logs,iam,sts,cloudwatch
      - DEBUG=0
      - DEFAULT_REGION=us-east-1
      - DATA_DIR=/var/lib/localstack/data
      - PERSISTENCE=1
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Same 50s ceiling as ClickHouse had. LocalStack with PERSISTENCE=1 and six
      # services to bring up is the other slow starter here; give it room before
      # the retry budget starts counting.
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 768M

  # ═══════════════════════════════════════════════════════════
  #  Confluence-compatible mock API (20 fake runbooks)
  # ═══════════════════════════════════════════════════════════
  confluence-mock:
    <<: *demo-common
    build:
      context: ./confluence-mock
      dockerfile: Dockerfile
    container_name: aegis-demo-confluence
    ports:
      - "8090:8090"
    # No healthcheck override here on purpose. This service's own Dockerfile already
    # declares one using python's urllib, which is the right call because the base is
    # python:3.12-slim and that image has no curl. The override this replaced ran
    # `curl -f http://localhost:8090/healthz`, so it failed every time regardless of
    # the app's state — uvicorn logged "Application startup complete" and compose
    # still reported the container unhealthy, which took aegis-api down with it via
    # depends_on. Verified: `docker run --rm python:3.12-slim which curl` finds nothing.
    deploy:
      resources:
        limits:
          memory: 128M

  # ═══════════════════════════════════════════════════════════
  #  Redis (kill switch / rate limits / cache)
  # ═══════════════════════════════════════════════════════════
  redis:
    <<: *demo-common
    image: redis:7-alpine
    container_name: aegis-demo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-demo:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ═══════════════════════════════════════════════════════════
  #  Ollama (optional — local LLM for offline demos)
  #  Enable with: docker compose --profile ollama up
  # ═══════════════════════════════════════════════════════════
  ollama:
    <<: *demo-common
    image: ollama/ollama:0.3.12
    container_name: aegis-demo-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: >
      /bin/sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull llama3.2:1b &&
      wait
      "
    deploy:
      resources:
        limits:
          memory: 2048M

  # ═══════════════════════════════════════════════════════════
  #  Aegis AI Engine (FastAPI)
  # ═══════════════════════════════════════════════════════════
  aegis-api:
    <<: *demo-common
    build:
      context: ../../apps/ai-engine
      dockerfile: Dockerfile
    container_name: aegis-demo-api
    ports:
      - "8000:8000"
    environment:
      # Demo mode flag — disables external writes
      AEGIS_DEMO_MODE: "true"
      API_PORT: "8000"
      DEBUG: "true"
      # LLM (no real key needed when Ollama profile used)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-demo-no-key}"
      MODEL_NAME: "claude-sonnet-4-6"
      OLLAMA_URL: "http://ollama:11434"
      # Observability
      SIGNOZ_API_URL: "http://signoz-query-service:8080"
      SIGNOZ_API_KEY: "demo-key"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-otel-collector:4317"
      # AWS (LocalStack)
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_REGION: "us-east-1"
      AWS_ENDPOINT_URL: "http://localstack:4566"
      # Confluence mock
      CONFLUENCE_BASE_URL: "http://confluence-mock:8090"
      CONFLUENCE_API_TOKEN: "demo-token"
      # Kill switch
      REDIS_URL: "redis://redis:6379"
      # Vault
      AEGIS_VAULT_PATH: "/var/lib/aegis/vault"
    volumes:
      - aegis-vault:/var/lib/aegis/vault
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      confluence-mock:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  # ═══════════════════════════════════════════════════════════
  #  Aegis Web (Next.js)
  # ═══════════════════════════════════════════════════════════
  aegis-web:
    <<: *demo-common
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: aegis-demo-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_SIGNOZ_URL: "http://localhost:3301"
    depends_on:
      - aegis-api
    deploy:
      resources:
        limits:
          memory: 512M
